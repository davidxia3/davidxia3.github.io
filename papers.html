<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papers</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f8f9fa;
            color: #2d2d2d;
        }
        h1 {
            color: #0e0e0e;
            text-align: center;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        .paper-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #3e3e3e;
        }
        .authors {
            font-style: italic;
            color: #7c7c7c;
        }
        .links a {
            color: #1c1c1c;
            text-decoration: none;
            margin-right: 10px;
            background-color: #e3e3e3;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .links a:hover {
            background-color: #c6c6c6;
        }
        nav {
            margin-top: 20px;
            text-align: center;
        }
        nav a {
            color: #2e2e2e;
            text-decoration: none;
            margin: 0 10px;
            background-color: #e3e3e3;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #c6c6c6;
        }
    </style>
</head>
<body>
    <h1>Papers</h1>

    <ul>
        <li>
            <div class="paper-title">EveGuard: Defeating Vibration-based Side-Channel Eavesdropping with Audio Adversarial Perturbations</div>
            <div class="authors">Jung-Woo Chang, Ke Sun, <b>David Xia</b>, Xinyu Zhang, Farinaz Koushanfar</div>
            <div class="links">
                <a href="https://arxiv.org/abs/2411.10034" target="_blank">arXiv</a>
            </div>
        </li>
    </ul>

    <nav>
        <a href="index.html">Home</a>
    </nav>
</body>
</html>
